<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker
          id="arrow"
          viewBox="0 0 10 10"
          refX="10"
          refY="5"
          markerWidth="4"
          markerHeight="4"
          orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" />
        </marker>
    </defs>
    <path
        d="
        M 15 15
        H 85
        V 85
        H 15
        V 15
        "
        fill="#4792d4"
        fill-opacity="50%"
    />

    <!-- Outer Path -->
    <g stroke="black" fill="none" marker-end="url(#arrow)">
        <line x1="15" y1="15" x2="85" y2="15"/>
        <line x1="85" y1="15" x2="85" y2="85"/>
        <line x1="85" y1="85" x2="15" y2="85"/>
        <line x1="15" y1="85" x2="15" y2="15"/>
    </g>
</svg>
