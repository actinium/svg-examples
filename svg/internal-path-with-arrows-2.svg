<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker
          id="arrow"
          viewBox="0 0 10 10"
          refX="10"
          refY="5"
          markerWidth="4"
          markerHeight="4"
          orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" />
        </marker>
    </defs>
    <path
        d="
        M 15 15
        H 85
        V 85
        H 15
        V 15

        M 25 25
        V 75
        H 75
        V 25
        H 25
        "
        fill="#4792d4"
        fill-opacity="50%"
    />

    <!-- Inner Cutout Path -->
    <g stroke="black" fill="none" marker-end="url(#arrow)">
        <line x1="25" y1="25" x2="25" y2="75"/>
        <line x1="25" y1="75" x2="75" y2="75"/>
        <line x1="75" y1="75" x2="75" y2="25"/>
        <line x1="75" y1="25" x2="25" y2="25"/>
    </g>
</svg>
